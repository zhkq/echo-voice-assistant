# CI for ECHO.
#
# Design (2026-09-15, extended 2026-09-19 with macOS):
#   * The *contract* job runs on ALL THREE platforms: it stays on light dependencies
#     (stdlib + ruff + numpy) and catches the failure class that used to slip through by
#     hand: undefined names left behind by removed imports (ruff F821) plus syntax
#     errors (E9), platform code dragged into app/ (tests/test_platform_contract.py),
#     and the platform seam breaking on a platform we do not develop on
#     (tests/test_path_seam.py + tests/test_paths.py).
#     macOS is in the matrix precisely because nobody here develops on one: without
#     this job, a Windows-only import at module level (the 1.x defect that forced the
#     `sys.modules` injection hack) would only be discovered by a human on a Mac.
#     Why numpy is in there too (2026-09-20): tests/test_paths.py exercises the path
#     layer against the real runtime modules (`app.meeting` -> `app.audio.recorder`,
#     `app.audio.diarize`), which import numpy at module level. Without it those two path
#     tests died with `ModuleNotFoundError: numpy` on EVERY runner, so this job was
#     permanently red and every PR looked un-mergeable. numpy is a small universal wheel,
#     so the job stays "light".
#   * The full Windows smoke (real deps: torch / funasr / soundfile …) is heavy, so it
#     is opt-in: manual dispatch or the weekly schedule. Locally the same thing is
#     scripts/check-windows.ps1, which gh-push.ps1 runs before every push.
#   * `macos-audio` (2026-09-20) is the third job: it runs the POSIX-only microphone
#     subprocess-isolation tests, which no other job can run (see the comment on the job
#     itself). It stays light (numpy only) so it can guard every PR.
#     A macOS *full* smoke is still NOT here: it needs the mac dependency set
#     (mac/requirements-mac.txt) plus a runner with the right Python; tracked in P3/P4.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC - weekly deep smoke

jobs:
  static:
    name: static / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff numpy

      - name: Compile all Python sources
        run: python -m compileall -q app mac scripts

      - name: Ruff (undefined names / syntax)
        run: python -m ruff check --select F821,E9 app mac scripts

      - name: Cross-platform contract tests
        run: python -m unittest -q tests.test_platform_contract

      - name: Platform seam + path layer guards
        # 纯标准库：不需要 torch 之类重依赖，所以三平台都能跑
        run: python -m unittest -q tests.test_path_seam tests.test_paths tests.test_platform_settings

  # Why this job exists (2026-09-20): the microphone fix from PR #5 moves EVERY macOS
  # CoreAudio call into a disposable child process (app/audio/mic.py), because a wedged
  # CoreAudio HAL can only be recovered by killing the owner. Its tests are POSIX-only
  # (@unittest.skipIf(os.name == "nt", "macOS isolation uses POSIX descriptor passing")),
  # so until now NO job ran them: `static` does not select them, and `windows-smoke`
  # runs on Windows where they skip. The single most important behaviour of that change
  # was therefore verified on no machine but the author's own Mac.
  #
  # Light deps only: numpy, plus the tests' own fake `sounddevice` fixture. No PortAudio,
  # no torch, no real microphone is touched.
  macos-audio:
    name: macos audio isolation (POSIX-only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install light test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Microphone isolation must RUN here (guard against silent re-skipping)
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v tests.test_mic_reliability 2>&1 | tee mic-reliability.log
          if grep -q 'skipped=' mic-reliability.log; then
            echo "::error::test_mic_reliability reported skips on macOS. This job exists to"
            echo "::error::run the POSIX-only subprocess-isolation tests; if they are being"
            echo "::error::skipped here, the microphone fix is not covered anywhere."
            exit 1
          fi

      - name: Ownership, recording recovery, port handoff, mac sidebar
        run: >-
          python -m unittest -v
          tests.test_recorder_device_choice
          tests.test_recorder_startup
          tests.test_ports
          tests.test_mac_sidebar

  windows-smoke:
    name: windows smoke (full deps)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch + requirements)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Windows gate (compile + import + contract + tests)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\check-windows.ps1
