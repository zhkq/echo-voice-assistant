[project]
name = "echo"
# 版本号唯一权威来源是 app/__init__.py:__version__，这里必须与它一致
# （由 tests/test_version.py 断言，发版脚本也会同步）。见 docs/REFACTOR-PLAN.md §13.3
version = "2.0.0"
description = "ECHO — 个人语音助理（本地转写 + DSH 执行 + 会议纪要 + 控制面板）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "soxr>=0.3",
    "faster-whisper>=1.1",
    "funasr>=1.2",
    "sherpa-onnx>=1.10",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "numpy>=1.26",
    "edge-tts>=7.0",
    "pyannote.audio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools]
packages = ["app", "app.audio"]

[tool.ruff]
line-length = 110
target-version = "py311"
