<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO 能力后端 · 管理面</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --card2:#1e222b; --text:#e6e8ec;
          --muted:#9aa3b2; --border:#2a2f3a; --green:#3fb950; --red:#f85149;
          --yellow:#d29922; --accent:#388bfd; }
  * { box-sizing:border-box; min-width:0; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
           padding:10px 16px; border-bottom:1px solid var(--border); }
  header .t { font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  header .spacer { flex:1; }
  button { background:var(--card2); color:var(--text); border:1px solid var(--border);
           border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--red); border-color:#5a2a2a; }
  button.danger:hover { border-color:var(--red); }
  main { padding:12px 16px 40px; max-width:1200px; margin:0 auto; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .tabs button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px;
          padding:12px 14px; margin-bottom:12px; min-width:0; }
  .card h2 { margin:0 0 8px; font-size:14px; font-weight:600; }
  .card.once { border-color:var(--yellow); }
  .kv { display:flex; gap:18px; flex-wrap:wrap; }
  .kv div { min-width:0; }
  .kv b { display:block; font-size:18px; }
  .kv span { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; }
  code { background:var(--bg); border:1px solid var(--border); border-radius:4px;
         padding:1px 5px; font-size:12px; }
  .muted { color:var(--muted); }
  .badge { padding:1px 8px; border-radius:10px; font-size:12px;
           border:1px solid var(--border); }
  .on { color:var(--green); border-color:var(--green); }
  .off { color:var(--red); border-color:var(--red); }
  .idle { color:var(--yellow); border-color:var(--yellow); }
  #login { max-width:340px; margin:12vh auto; }
  #login input { width:100%; margin:6px 0; padding:8px 10px; border-radius:6px;
                 border:1px solid var(--border); background:var(--card2); color:var(--text); }
  #err { color:var(--red); font-size:13px; min-height:20px; }
  .hidden { display:none !important; }
  .form { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:8px; }
  .form label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  .form input, .form select { padding:6px 8px; border-radius:6px; min-width:170px;
                              border:1px solid var(--border); background:var(--card2);
                              color:var(--text); font-size:13px; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; }
  .acts button { padding:3px 8px; font-size:12px; }
  .secret { font-family:ui-monospace,Consolas,monospace; font-size:13px; word-break:break-all;
            background:var(--bg); border:1px solid var(--yellow); border-radius:6px;
            padding:8px 10px; margin-top:8px; user-select:all; }
  .errtxt { color:var(--red); font-size:12px; min-height:16px; margin-top:6px; }
  /* 性能页签：**4 张图，一行 2 个、共 2 行**（窄屏落成 1 列，免得图变成一条线） */
  .charts { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; }
  @media (max-width:820px) { .charts { grid-template-columns:minmax(0, 1fr); } }
  .chart { margin-bottom:0; }
  .chart h2 { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .chart h2 .now { color:var(--muted); font-size:12px; font-weight:400; text-align:right; }
  .chart svg { display:block; width:100%; height:auto; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:12px;
            margin-top:4px; }
  .swatch { display:inline-block; width:10px; height:10px; border-radius:2px;
            margin-right:4px; vertical-align:middle; }
  .perfbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .perfbar .stat { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h2>ECHO 能力后端 · 管理面</h2>
    <div class="muted" style="font-size:12px">
      模型、客户端、调用与「存了什么」，以及<b>发授权 / 禁用 / 撤销 / 改权限与配额 / 轮换 secret /
      运行参数（并发·队列，改完立刻生效）</b>。
      写动作要登录，且只在<b>本站页面</b>里能发（跨站请求一律 403）。
    </div>
    <input id="u" placeholder="管理员用户名" autocomplete="username">
    <input id="p" type="password" placeholder="口令" autocomplete="current-password">
    <div style="display:flex;gap:8px;align-items:center">
      <button class="primary" id="btnLogin">登录</button>
      <span id="err"></span>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <span class="t">ECHO 能力后端</span>
    <span class="sub" id="hdr"></span>
    <span class="spacer"></span>
    <span class="sub" id="who"></span>
    <button id="btnPwd">修改口令</button>
    <button id="btnReload">刷新</button>
    <button id="btnLogout">登出</button>
  </header>
  <main>
    <div class="tabs">
      <button data-tab="overview" class="active">概览</button>
      <button data-tab="models">模型</button>
      <button data-tab="clients">客户端 / 发授权</button>
      <button data-tab="calls">调用</button>
      <button data-tab="perf">性能</button>
      <button data-tab="inventory">存了什么</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<!-- 「性能」页签的 4 张图（**一行 2 个、共 2 行**，见 .charts 那个 grid）。
     放在 <template> 里是为了：① 静态 HTML 里就**真的有 4 个 svg 元素**（用例直接数得出来）；
     ② 切页签时不重复解析一遍这段标记，克隆进去就行。 -->
<template id="perfChartsTpl">
  <div class="charts">
    <div class="card chart">
      <h2>GPU 利用率<span class="now" id="now-gpu">—</span></h2>
      <svg id="chart-gpu" viewBox="0 0 360 150" role="img" aria-label="GPU 利用率折线图"></svg>
      <div class="legend" id="legend-gpu"></div>
    </div>
    <div class="card chart">
      <h2>显存<span class="now" id="now-vram">—</span></h2>
      <svg id="chart-vram" viewBox="0 0 360 150" role="img" aria-label="显存折线图"></svg>
      <div class="legend" id="legend-vram"></div>
    </div>
    <div class="card chart">
      <h2>CPU<span class="now" id="now-cpu">—</span></h2>
      <svg id="chart-cpu" viewBox="0 0 360 150" role="img" aria-label="CPU 使用率折线图"></svg>
      <div class="legend" id="legend-cpu"></div>
    </div>
    <div class="card chart">
      <h2>内存<span class="now" id="now-ram">—</span></h2>
      <svg id="chart-ram" viewBox="0 0 360 150" role="img" aria-label="内存使用率折线图"></svg>
      <div class="legend" id="legend-ram"></div>
    </div>
  </div>
</template>

<script>
const $ = (s) => document.querySelector(s);
let CSRF = "";
/* 「只显示这一次」的东西（新 secret / 新配对串）只活在这个变量里：
   刷新页面 = 变量没了 = 不再回显。后端也不会再给（库里只有哈希）。 */
let ONCE = null;
/* 改口令的策略（位数上下限）。**由 `/admin/api/admins` 带下来**（那就是权威那份，
   见 `server/admin.py` 的 `MIN_PASSWORD_LEN`）；这里的初值只是"还没读到"时的兜底，
   页面拿它做**提前提示**，真正的判定在服务端。 */
let PWD = { minLength: 8, maxLength: 200 };

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: "same-origin", ...opts });
  if (res.ok) return res.json();
  let body = null;
  try { body = await res.json(); } catch (e) { body = null; }
  const msg = body
    ? ((body.message || ("HTTP " + res.status)) + (body.detail ? "：" + body.detail : ""))
    : ("HTTP " + res.status);
  if (res.status === 401 && !$("#app").classList.contains("hidden")) showLogin();
  throw new Error(msg);
}

/* 写请求：必须带**非简单请求标志头**与 CSRF 令牌（Origin 由浏览器自己带）。
   这两个头不是"再多验一次身份"，而是让浏览器必须先发预检 —— 跨站表单发不出自定义头。 */
function whdrs() {
  return { "Content-Type": "application/json", "X-ECHO-Admin": "1", "X-CSRF-Token": CSRF };
}
async function wpost(path, body) {
  return api(path, { method: "POST", headers: whdrs(), body: JSON.stringify(body || {}) });
}
async function wdelete(path, body) {
  return api(path, { method: "DELETE", headers: whdrs(), body: JSON.stringify(body || {}) });
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
/* 表格里要放按钮时用它包一下（**调用方负责转义里面的值**）。 */
const raw = (html) => ({ __raw: html });
const hm = (sec) => {
  sec = Number(sec || 0);
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600),
        m = Math.floor((sec % 3600) / 60);
  return (d ? d + "d " : "") + h + "h " + m + "m";
};
const ago = (ts) => {
  ts = Number(ts || 0);
  if (!ts) return "—";
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  return s < 60 ? s + " 秒前" : (s < 3600 ? Math.floor(s / 60) + " 分钟前" : hm(s) + " 前");
};
const ts = (v) => (Number(v || 0) ? new Date(Number(v) * 1000).toLocaleString() : "—");
const left = (sec) => {
  sec = Number(sec || 0);
  // 后端只把「还能用」的码放进这张表（未用过、未过期），而且 remainingSeconds 最少报 1 ——
  // 所以这里的"已过期"分支只是**防身**（万一某张码在响应与渲染之间到期），
  // 正常路径上不会出现"徽章写着已过期、行却列在待用表里"。不到 1 分钟如实报秒。
  if (sec <= 0) return '<span class="badge off">已过期</span>';
  if (sec < 60) return sec + " 秒";
  return sec < 3600 ? Math.ceil(sec / 60) + " 分钟"
                    : (sec < 86400 ? (sec / 3600).toFixed(1) + " 小时" : (sec / 86400).toFixed(1) + " 天");
};
const mb = (n) => (Number(n || 0) / 1024).toFixed(1) + " GB";

function showLogin() {
  stopPerfPoll();          // 掉线了就别再轮询（后端"有人在看"的判定也随之过期）
  $("#login").classList.remove("hidden");
  $("#app").classList.add("hidden");
}
function showApp() {
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
}

$("#btnLogin").onclick = async () => {
  $("#err").textContent = "";
  try {
    const r = await api("/admin/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("#u").value, password: $("#p").value }),
    });
    CSRF = r.csrf || "";
    showApp();
    await boot();
  } catch (e) { $("#err").textContent = e.message; }
};
$("#p").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#btnLogin").click(); });

$("#btnLogout").onclick = async () => {
  try {
    await wpost("/admin/api/logout");
  } catch (e) { /* 会话可能已经过期，照样回登录页 */ }
  CSRF = "";
  ONCE = null;
  showLogin();
};
$("#btnReload").onclick = () => render();

function activateTab(name) {
  document.querySelectorAll(".tabs button").forEach((x) =>
    x.classList.toggle("active", x.dataset.tab === name));
  return render();
}
document.querySelectorAll(".tabs button").forEach((b) => {
  b.onclick = () => activateTab(b.dataset.tab);
});

/* 右上角的「修改口令」= 跳到「存了什么」里那张账号卡（表单**只有一份**，
   不存在两处各改一次、口径漂开的可能）。跳过去之后滚到它、并把光标放进
   「当前口令」那一格 —— 这个入口的全部价值就是"不用找"。 */
$("#btnPwd").onclick = async () => {
  await activateTab("inventory");
  const box = $("#pwCard");
  if (box && box.scrollIntoView) box.scrollIntoView({ block: "center" });
  const first = $("#pwCur");
  if (first) first.focus();
};

async function boot() {
  try {
    const me = await api("/admin/api/me");
    CSRF = me.csrf || CSRF;
    $("#who").textContent = "管理员：" + me.username + " · 会话 " + me.sessions + " 个";
    showApp();
    await render();
  } catch (e) { showLogin(); }
}

async function render() {
  const tab = (document.querySelector(".tabs button.active") || {}).dataset?.tab || "overview";
  const v = $("#view");
  stopPerfPoll();          // 切走「性能」页签就不再取点（后端最多再采 viewerTtl 秒）
  try {
    if (tab === "overview") v.innerHTML = await viewOverview();
    else if (tab === "models") v.innerHTML = await viewModels();
    else if (tab === "clients") { v.innerHTML = await viewClients(); bindClients(); }
    else if (tab === "calls") v.innerHTML = await viewCalls();
    else if (tab === "perf") { v.innerHTML = await viewPerf(); bindPerf(); }
    else { v.innerHTML = await viewInventory(); bindPassword(); }
  } catch (e) {
    v.innerHTML = `<div class="card"><h2>读不到</h2><div class="muted">${esc(e.message)}</div></div>`;
  }
}

async function viewOverview() {
  const d = await api("/admin/api/overview");
  $("#hdr").textContent = `${d.server.id} · v${d.server.version} · 运行 ${hm(d.server.uptimeSeconds)}`
    + (d.server.tls ? " · https" : " · http");
  const m = d.metrics, q = d.quota;
  const used = Object.values(q.clients || {}).reduce((a, b) => a + Number(b || 0), 0);
  const okRate = m.totalCalls ? (100 * (m.totalCalls - m.totalErrors) / m.totalCalls).toFixed(1) : "—";
  const errs = Object.entries(m.errorCodes || {}).map(([k, n]) => `${k}×${n}`).join("、") || "无";
  return `<div class="card"><h2>概览</h2>
    <div class="kv">
      <div><b>${d.busy.active} / ${d.busy.maxConcurrent}</b><span>当前并发（每客户端上限 ${d.busy.perClientConcurrent}）</span></div>
      <div><b>${m.totalCalls}</b><span>累计调用（本次进程）</span></div>
      <div><b>${okRate}%</b><span>成功率</span></div>
      <div><b>${used.toFixed(1)} 分钟</b><span>今日音频（各客户端合计）</span></div>
      <div><b>${d.sessions}</b><span>管理面在线会话</span></div>
      <div><b>${Object.keys(q.clients || {}).length}</b><span>今日用过的客户端</span></div>
    </div>
    <div style="margin-top:8px" class="muted">错误码：${esc(errs)}</div>
    <div class="muted">显存：${esc(JSON.stringify(d.vram))} · 调用记录队列：排队 ${d.calls.queued ?? 0}
      · 丢弃 ${d.calls.dropped ?? 0}（丢弃是"审计写不进去"，不是请求失败）</div>
  </div>
  <div class="card"><h2>各端点</h2>${table(
    ["端点", "调用", "失败", "音频分钟", "最近耗时", "最慢"],
    Object.entries(m.endpoints || {}).map(([k, r]) => [k, r.calls, r.errors,
      (Number(r.audioSeconds || 0) / 60).toFixed(2), r.lastMs + " ms", r.maxMs + " ms"]))}</div>`;
}

async function viewModels() {
  const d = await api("/admin/api/models");
  return `<div class="card"><h2>模型</h2>${table(
    ["模型", "槽", "状态", "常驻", "估显存", "并发", "向量空间"],
    d.models.map((x) => [x.id, x.slot || "—", x.state, x.resident ? "是" : "否",
      mb(x.estVramMb), x.maxConcurrency, x.vectorSpaceId || "—"]))}
    <div class="muted" style="margin-top:8px">显存：${esc(JSON.stringify(d.vram))}。
      加载/卸载是能力面自己的状态机（按需 + LRU），模型加载/卸载不在这里（那是能力面自己的状态机）；发授权与客户端管理在「客户端」页签。</div></div>`;
}

/* ---------------------------------------------------------------- 客户端 / 发授权 */

function onceCard() {
  if (!ONCE) return "";
  return `<div class="card once">
    <h2>${esc(ONCE.title)}</h2>
    <div class="muted">⚠️ <b>只显示这一次</b>：刷新页面后不再出现，后端也不会再给
      （库里只有哈希）。现在复制走。</div>
    <div class="secret" id="onceVal">${esc(ONCE.value)}</div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="primary" id="btnCopy">复制</button>
      <button id="btnOnceClose">我已复制，关掉</button>
    </div>
    ${ONCE.extra ? `<div class="muted" style="margin-top:6px">${esc(ONCE.extra)}</div>` : ""}
  </div>`;
}

function bindOnce() {
  const copy = $("#btnCopy");
  if (!copy) return;
  copy.onclick = async () => {
    const text = ONCE ? ONCE.value : "";
    try {
      await navigator.clipboard.writeText(text);
      copy.textContent = "已复制 ✓";
    } catch (e) {
      // 回退：把文本选中，让人自己 Ctrl+C（老浏览器 / 非安全上下文里 clipboard 可能不可用）
      const el = $("#onceVal");
      const r = document.createRange();
      r.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
      copy.textContent = "已选中，请按 Ctrl+C";
    }
  };
  const close = $("#btnOnceClose");
  if (close) close.onclick = () => { ONCE = null; render(); };
}

function issueForm() {
  const ttls = [["900", "15 分钟"], ["3600", "1 小时"], ["86400", "1 天"], ["604800", "7 天"]];
  return `<div class="card"><h2>发授权（给新客户端一张配对码）</h2>
    <div class="muted">生成一串 <code>echo://pair?host=…&amp;code=…</code>，粘给同事在客户端面板里
      <b>用一次</b>。名字与 scopes <b>跟着码走</b>（对端自报的盖不过它）。</div>
    <div class="form">
      <label>客户端名字<input id="pcName" placeholder="张三的办公本"></label>
      <label>scopes<input id="pcScopes" placeholder="asr diarize（逗号或空格；空 = 不限）"></label>
      <label>有效期<select id="pcTtl">${ttls.map(([v, t]) =>
        `<option value="${v}">${t}</option>`).join("")}</select></label>
      <label>备注（谁发的）<input id="pcNote" placeholder="ops"></label>
      <button class="primary" id="btnIssue">生成配对码</button>
    </div>
    <div class="errtxt" id="issueErr"></div></div>`;
}

function pendingCodes(d) {
  const rows = (d.codes || []).map((c) => [
    c.name || "(未命名)", c.scopes || "(不限)", c.createdBy || "—",
    c.expired ? '<span class="badge off">已过期</span>' : left(c.remainingSeconds),
    ts(c.expiresAt),
    raw(`<button class="danger" data-code="${esc(c.id)}">作废</button>`),
  ]);
  // 标题写"能用的"：这张表里**只有能用的码**（后端已经把用过 / 过期的排除掉了），
  // 免得再出现"标题说待用、行里写着已过期"那种自相矛盾。
  return `<div class="card"><h2>待用的配对码（能用的 ${(d.codes || []).length} 张）</h2>
    ${table(["名字", "scopes", "谁发的", "剩余", "到期时间", "操作"], rows)}
    <div class="muted" style="margin-top:6px">${esc(d.note)}</div></div>`;
}

function clientActions(c) {
  const id = esc(c.clientId);
  return `<div class="acts">
    <button data-act="${c.disabled ? "enable" : "disable"}" data-id="${id}">${c.disabled ? "启用" : "禁用"}</button>
    <button class="danger" data-act="revoke" data-id="${id}">撤销</button>
    <button data-act="scopes" data-id="${id}" data-scopes="${esc(c.scopes)}">改 scopes</button>
    <button data-act="quota" data-id="${id}" data-quota="${Number(c.dailyAudioMinutes || 0)}">改配额</button>
    <button class="danger" data-act="rotate" data-id="${id}">轮换 secret</button>

async function clientAction(btn) {
  const id = btn.dataset.id, act = btn.dataset.act;
  try {
    if (act === "disable" || act === "enable") {
      const q = act === "disable"
        ? "禁用 " + id + "？\n\n它会收到 403（认识它但不许用）；凭据没有失效，随时能重新启用。"
        : "启用 " + id + "？\n\n它手上那个令牌直接就能用，不需要重新配对。";
      if (!confirm(q)) return;
      await wpost(`/admin/api/clients/${id}/${act}`);
    } else if (act === "revoke") {
      if (!confirm("撤销 " + id + "？\n\n它手上的令牌**立刻全部失效**，那台机器必须重新配对"
                   + "（重新发一张配对码）。")) return;
      await wpost(`/admin/api/clients/${id}/revoke`, { confirm: id });
    } else if (act === "scopes") {
      const v = prompt("新的 scopes（逗号或空格分隔；留空 = 不限）：", btn.dataset.scopes || "");
      if (v === null) return;
      await wpost(`/admin/api/clients/${id}/scopes`, { scopes: v });
    } else if (act === "quota") {
      const v = prompt("每日音频分钟数上限（0 = 用全局默认；**不清零今天的已用量**）：",
                       btn.dataset.quota || "0");
      if (v === null) return;
      await wpost(`/admin/api/clients/${id}/quota`, { dailyAudioMinutes: Number(v) });
    } else if (act === "rotate") {
      if (!confirm("轮换 " + id + " 的 secret？\n\n"
                   + "① 新的明文**只显示这一次**（关掉就再也看不到）；\n"
                   + "② 它原来那些令牌立刻全失效。")) return;
      const r = await wpost(`/admin/api/clients/${id}/rotate-secret`, { confirm: id });
      ONCE = {
        title: "新的 secret（" + id + "）",
        value: r.secret,
        extra: "带外交给那台机器：旧 secret 与旧令牌已经立刻失效。",
      };
    }
    await render();
  } catch (e) { alert("失败：" + e.message); }
}

async function dropCode(btn) {
  const id = btn.dataset.code;
  if (!confirm("作废这张配对码？\n\n它还没被用过；作废之后那个码就兑不了了。")) return;
  try {
    await wdelete("/admin/api/pairing-codes/" + encodeURIComponent(id), { confirm: id });
    await render();
  } catch (e) { alert("失败：" + e.message); }
}

/* ---------------------------------------------------------------- 管理员账号 + 改口令

   立场（与 `server/admin.py` 开头那段是同一件事，别改一边忘了另一边）：
   **新增 / 删除 / 禁用管理员、改别人的口令，一律只在命令行** —— 那是"谁能进门"的事，
   而面板本身就在这扇门里（一次会话劫持就能顺手把自己加成管理员）。
   面板只开**一条**口子：**改自己的口令**，而且必须先给出**当前口令**
   （攻击者拿到会话也改不掉口令，因为他不知道当前口令）。

   两句说明文案由 `/admin/api/admins` 给（`note` / `selfServiceNote`），页面只负责显示：
   写成两处必然漂开，而这种"页面上的承诺"漂开是最贵的一种 bug。 */
function accountsCard(acc) {

  return `<div class="card" id="pwCard"><h2>管理员账号（增删仍只在命令行）</h2>${table(
    ["账号", "状态", "建号", "最后登录"],

      a.disabled ? '<span class="badge off">已禁用</span>' : '<span class="badge on">正常</span>',

    <div class="muted" style="margin-top:6px">${esc(acc.note || "")}</div>

    <h2 style="margin-top:14px">修改我的口令</h2>
    <div class="muted">只改<b>当前登录的这一个账号</b>${acc.self ? "（" + esc(acc.self) + "）" : ""}，
      并且要先填<b>当前口令</b>。新口令至少 <b>${min}</b> 位（最多 ${max} 位）；
      改成功之后<b>其它已登录的会话立刻失效</b>，当前这个会话保留。
      口令只在这条请求的请求体里，**不写进浏览器存储、也不进 URL**。</div>
    <div class="form">
      <label>当前口令<input id="pwCur" type="password" autocomplete="current-password"></label>
      <label>新口令<input id="pwNew" type="password" autocomplete="new-password"></label>
      <label>确认新口令<input id="pwNew2" type="password" autocomplete="new-password"></label>
      <button class="primary" id="btnPwSave">修改口令</button>

    <div class="errtxt" id="pwErr"></div>

}

function bindPassword() {
  const btn = $("#btnPwSave");
  if (!btn) return;
  const err = $("#pwErr"), ok = $("#pwOk");
  const fail = (m) => { if (err) err.textContent = m; };
  btn.onclick = async () => {
    if (err) err.textContent = "";
    if (ok) ok.textContent = "";
    const cur = $("#pwCur").value, next = $("#pwNew").value, again = $("#pwNew2").value;
    const min = Number(PWD.minLength || 8);
    /* **客户端先把明显不合格的挡掉**（两次不一致就不发请求）——
       但这不是保证：服务端那份（`server/admin.py` 的策略 + 当前口令校验）才算数。 */
    if (!cur) return fail("请先填当前口令");
    if (next.length < min) return fail("新口令至少 " + min + " 位");
    if (next !== again) return fail("两次输入的新口令不一致");
    if (next === cur) return fail("新口令不能与当前口令相同");
    try {
      const r = await wpost("/admin/api/password", { current: cur, new: next });
      ["#pwCur", "#pwNew", "#pwNew2"].forEach((s) => { const el = $(s); if (el) el.value = ""; });
      const revoked = Number(r.sessionsRevoked || 0);
      if (ok) ok.textContent = "已修改口令。" + (revoked ? "另外 " + revoked + " 个登录会话已失效，" : "")
        + "当前这个会话保留。新增 / 删除管理员仍然只能在命令行做。";
    } catch (e) {
      /* 失败原因（中文）由后端给：口令太短、当前口令不对、被闸门挡回来…… */
      fail("修改失败：" + e.message);
    }
  };
  ["#pwCur", "#pwNew", "#pwNew2"].forEach((s) => {
    const el = $(s);
    if (el) el.addEventListener("keydown", (e) => { if (e.key === "Enter") btn.click(); });
  });
}

/* ---------------------------------------------------------------- 性能（4 张图，2×2） */

/* 点只在**这个数组**里攒；服务端的环形窗口是权威（见 mergePoints）。
   前端也不落盘：没有 localStorage / sessionStorage / IndexedDB —— 刷新即清零。
   刷新机制是**增量轮询**：1.5 秒一次 `?since=<nextSince>`，只取新点；
   （SSE 没必要：这里的数据本来就是"每秒一个点"，轮询的延迟上限就是一个间隔，
   而 SSE 要额外处理断线重连与代理缓冲，换不来什么。）*/
const PERF = { points: [], since: "", timer: null, state: null };

const PERF_POLL_MS = 1500;
const CHART_W = 360, CHART_H = 150;
const CHART_PAD = { l: 38, r: 18, t: 10, b: 18 };

const pct = (v) => (v == null || v === "" ? "—" : Number(v).toFixed(1) + "%");
const mbText = (v) => (v == null || v === "" ? "—" : Math.round(Number(v)) + " MB");
const deg = (v) => (v == null || v === "" ? "—" : Math.round(Number(v)) + "°C");
const watt = (v) => (v == null || v === "" ? "—" : Number(v).toFixed(0) + " W");
const axisNum = (v) => String(v >= 1000 ? Math.round(v) : Math.round(v * 10) / 10);

function niceMax(v) {
  v = Number(v || 0);
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v / p) * p;
}

const maxOf = (vals) => {
  const nums = vals.filter((v) => v != null && isFinite(v));
  return nums.length ? Math.max.apply(null, nums) : 0;
};

/* 每张图的规格：系列、Y 轴上界、右上角那行小字。
   `leftMax` 给固定上限（GPU/CPU/内存 0~100）；`leftMaxKey` 按点里那个字段取
   （显存 = 卡的总显存）。都不给就按数据自适应。 */
const PERF_CHARTS = [
  { svg: "#chart-gpu", legend: "#legend-gpu", head: "#now-gpu", leftMax: 100,
    rightMaxKey: "maxConcurrent",
    series: [{ key: "gpuPercent", color: "#3fb950", name: "GPU 利用率 (%)" },
             { key: "active", color: "#d29922", name: "在途请求数（右轴）", axis: "r", dash: "4 2" }],
    readout: (p) => `${pct(p.gpuPercent)} · 温度 ${deg(p.gpuTempC)} · 功耗 ${watt(p.gpuPowerW)}` },
  { svg: "#chart-vram", legend: "#legend-vram", head: "#now-vram", leftMaxKey: "gpuMemTotalMb",
    series: [{ key: "gpuMemUsedMb", color: "#388bfd", name: "显卡已用 (MB)" },
             { key: "vramUsedMb", color: "#d29922", name: "后端自报 (MB)", dash: "4 2" }],
    readout: (p) => `${mbText(p.gpuMemUsedMb)} / ${mbText(p.gpuMemTotalMb)}`
                    + ` · 后端自报 ${mbText(p.vramUsedMb)}` },
  { svg: "#chart-cpu", legend: "#legend-cpu", head: "#now-cpu", leftMax: 100,
    series: [{ key: "cpuPercent", color: "#388bfd", name: "CPU (%)" }],
    readout: (p) => pct(p.cpuPercent) },
  { svg: "#chart-ram", legend: "#legend-ram", head: "#now-ram", leftMax: 100,
    series: [{ key: "memPercent", color: "#3fb950", name: "内存 (%)" }],
    readout: (p) => `${pct(p.memPercent)} · ${mbText(p.memUsedMb)} / ${mbText(p.memTotalMb)}` },
];

function linePath(vals, seqs, g, max) {
  const n = vals.length;
  const step = n > 1 ? g.w / (n - 1) : 0;
  let d = "", open = false;
  for (let i = 0; i < n; i++) {
    const v = vals[i];
    if (v == null || !isFinite(v)) { open = false; continue; }
    // 序号跳号 = 中间有点滚出了环形窗口：**断开**，不要把两个时刻连成一条假线
    if (open && i > 0 && Number(seqs[i]) - Number(seqs[i - 1]) > 1) open = false;
    const x = g.x0 + step * i;
    const y = g.y0 + g.h - g.h * Math.min(1, Math.max(0, v / (max || 1)));
    d += (open ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1) + " ";
    open = true;
  }
  return d.trim();
}

const clockOf = (p) => (p && p.t ? new Date(Number(p.t) * 1000).toLocaleTimeString() : "");

function drawChart(spec) {
  const svg = $(spec.svg);
  if (!svg) return;
  const pts = PERF.points;
  const seqs = pts.map((p) => p.seq);
  const g = { x0: CHART_PAD.l, y0: CHART_PAD.t,
              w: CHART_W - CHART_PAD.l - CHART_PAD.r, h: CHART_H - CHART_PAD.t - CHART_PAD.b };
  const series = spec.series.map((s) => Object.assign({}, s, {
    vals: pts.map((p) => (p[s.key] == null || p[s.key] === "" ? null : Number(p[s.key]))),
  }));
  const right = series.filter((s) => s.axis === "r");
  let leftMax = 0;
  if (typeof spec.leftMax === "number") leftMax = spec.leftMax;
  else if (spec.leftMaxKey) {
    const totals = pts.map((p) => Number(p[spec.leftMaxKey] || 0)).filter((v) => v > 0);
    leftMax = totals.length ? Math.max.apply(null, totals) : 0;
  }
  if (!(leftMax > 0)) {
    leftMax = niceMax(Math.max.apply(null, series.map((s) => maxOf(s.vals)).concat([0])));
  }
  let rightMax = 1;
  if (right.length) {
    rightMax = spec.rightMaxKey
      ? Math.max(1, Math.max.apply(null, pts.map((p) => Number(p[spec.rightMaxKey] || 0)).concat([0])))
      : niceMax(Math.max.apply(null, right.map((s) => maxOf(s.vals)).concat([1])));
  }
  const out = [];
  const yb = g.y0 + g.h;
  [0, 0.5, 1].forEach((f) => {                       // 横向网格：0 / 50% / 100%
    const y = yb - g.h * f;
    out.push(`<line x1="${g.x0}" y1="${y.toFixed(1)}" x2="${(g.x0 + g.w).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#2a2f3a" stroke-width="1"/>`);
    if (f !== 0.5) {
      out.push(`<text x="${g.x0 - 3}" y="${(y + 2.5).toFixed(1)}" fill="#9aa3b2" font-size="7.5" text-anchor="end">${esc(axisNum(leftMax * f))}</text>`);
    }
  });
  out.push(`<line x1="${g.x0}" y1="${g.y0}" x2="${g.x0}" y2="${yb}" stroke="#2a2f3a" stroke-width="1"/>`);
  out.push(`<line x1="${g.x0}" y1="${yb}" x2="${(g.x0 + g.w).toFixed(1)}" y2="${yb}" stroke="#2a2f3a" stroke-width="1"/>`);
  if (right.length) {                                // 右轴（在途请求数）：只有 0 与上限两个刻度
    out.push(`<text x="${(g.x0 + g.w + 3).toFixed(1)}" y="${(g.y0 + 6).toFixed(1)}" fill="#d29922" font-size="7.5">${esc(axisNum(rightMax))}</text>`);
    out.push(`<text x="${(g.x0 + g.w + 3).toFixed(1)}" y="${(yb + 2.5).toFixed(1)}" fill="#d29922" font-size="7.5">0</text>`);
  }
  const tl = clockOf(pts[0]), tr = clockOf(pts[pts.length - 1]);
  if (tl) out.push(`<text x="${g.x0}" y="${CHART_H - 5}" fill="#9aa3b2" font-size="7.5">${esc(tl)}</text>`);
  if (tr && pts.length > 1) {
    out.push(`<text x="${(g.x0 + g.w).toFixed(1)}" y="${CHART_H - 5}" fill="#9aa3b2" font-size="7.5" text-anchor="end">${esc(tr)}</text>`);
  }
  series.forEach((s) => {
    const d = linePath(s.vals, seqs, g, s.axis === "r" ? rightMax : leftMax);
    if (d) {
      out.push(`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.4" stroke-linejoin="round"${s.dash ? ` stroke-dasharray="${s.dash}"` : ""}/>`);
    }
  });
  svg.innerHTML = out.join("");
  const legend = $(spec.legend);
  if (legend) {
    legend.innerHTML = series.map((s) => {          // 最小值 / 最大值标注（需求点名要的）
      const nums = s.vals.filter((v) => v != null && isFinite(v));
      const mm = nums.length
        ? `最小 ${axisNum(Math.min.apply(null, nums))} / 最大 ${axisNum(Math.max.apply(null, nums))}`
        : "还没有数据";
      return `<span><i class="swatch" style="background:${s.color}"></i>${esc(s.name)}：${esc(mm)}</span>`;
    }).join("");
  }
  const head = $(spec.head);
  if (head) head.textContent = spec.readout(pts.length ? pts[pts.length - 1] : {});
}

const drawAllCharts = () => PERF_CHARTS.forEach(drawChart);

function stopPerfPoll() {
  if (PERF.timer) { clearInterval(PERF.timer); PERF.timer = null; }
}

async function viewPerf() {
  const tpl = document.getElementById("perfChartsTpl");
  // 「运行参数」读不到不该把 4 张图一起搞没（它是这一页的**另一个**接口）。
  let lim = null;
  try { lim = await api("/admin/api/limits"); } catch (e) { lim = { error: e.message }; }
  return `<div class="card">
    <h2>性能记录</h2>
    <div class="perfbar">
      <button class="primary" id="btnPerfStart">开始记录</button>
      <button class="danger" id="btnPerfStop">停止记录</button>
      <span class="badge idle" id="perfBadge">读状态…</span>
      <span class="stat" id="perfStat"></span>
    </div>
    <div class="muted" style="margin-top:6px" id="perfNote"></div>
  </div>${limitsCard(lim)}${tpl ? tpl.innerHTML : ""}`;
}

/* ---------------------------------------------------------------- 运行参数（并发 / 队列）

   需求（2026-09-29）：总通道出厂 6，而且**管理员在页面上就能改** —— 不用改环境变量、
   不用重启。放在「性能」页签里、**就在 4 张图上方**：并发上限本来就是一个性能参数，
   调它要看的就是旁边「在途请求数」与 GPU 利用率那两张图；而字段只有三个，
   不值得再开一个页签（页签已经 6 个了）。

   页面只负责"怎么问、怎么显示"：来源判定（管理面 / 环境变量 / 默认）与
   "谁盖了谁"的提示全部由后端 `/admin/api/limits` 给（`server/limits.py`）。 */
let LIMITS_SAVED = "";          // 「已保存并生效」这句只在**下一次渲染**里出现一次

function limitsCard(d) {
  if (!d || d.error) {
    return `<div class="card"><h2>运行参数</h2>
      <div class="errtxt">读不到：${esc((d && d.error) || "未知错误")}</div></div>`;
  }
  const L = d.limits || {}, S = d.source || {}, R = d.ranges || {}, LB = d.labels || {};
  const EN = d.envValues || {}, ENN = d.envNames || {};
  const srcBadge = (src) => src === "admin"
    ? '<span class="badge on">管理面配置</span>'
    : (src === "env" ? '<span class="badge idle">环境变量</span>'
                     : '<span class="badge">出厂默认</span>');
  const rows = Object.keys(LB).map((api) => [
    LB[api], Number(L[api]), raw(srcBadge(S[api])),
    EN[api] == null ? "—" : ENN[api] + "=" + EN[api],
  ]);
  const inputs = Object.keys(LB).map((api) => {
    const r = R[api] || [1, 64];
    return `<label>${esc(LB[api])}（${r[0]}~${r[1]}）
      <input id="lim-${esc(api)}" type="number" step="1" min="${r[0]}" max="${r[1]}"
             value="${Number(L[api])}"></label>`;
  }).join("");
  const notes = (d.notes || []).map((n) => `<div class="muted">⚠️ ${esc(n)}</div>`).join("");
  const saved = LIMITS_SAVED ? ` <span class="badge on">${esc(LIMITS_SAVED)}</span>` : "";
  LIMITS_SAVED = "";
  const changed = d.updatedAt
    ? `<div class="muted">上次改：${esc(ts(d.updatedAt))}${d.updatedBy ? " · 由 " + esc(d.updatedBy) : ""}</div>`
    : "";
  return `<div class="card"><h2>运行参数${saved}</h2>
    <div class="muted">${esc(d.priorityNote || "")}</div>
    ${table(["参数", "当前生效值", "来源", "环境变量"], rows)}
    <div class="form">${inputs}
      <button class="primary" id="btnLimits">保存并生效</button></div>
    <div class="errtxt" id="limitsErr"></div>
    <div class="muted" style="margin-top:6px">保存后<b>立刻生效</b>（不用重启容器），
      并写进 state 卷的库 —— 重启后还在。每客户端并发不能大于总并发。<br>
      ${esc(d.queueNote || "")}</div>
    ${notes}${changed}</div>`;
}

function bindLimits() {
  const btn = $("#btnLimits");
  if (!btn) return;
  btn.onclick = async () => {
    const err = $("#limitsErr");
    if (err) err.textContent = "";
    try {
      // 原样把输入框的字符串发过去，让后端给出**明确的中文原因**
      // （空/非数 → "总并发要是整数…"，越界 → "总并发要在 1 ~ 64 之间…"）。
      await wpost("/admin/api/limits", {
        maxConcurrent: $("#lim-maxConcurrent").value,
        perClientConcurrent: $("#lim-perClientConcurrent").value,
        queueMax: $("#lim-queueMax").value,
      });
      LIMITS_SAVED = "已保存并生效";
      await render();          // 就地刷新：生效值与来源重新读一遍
    } catch (e) { if (err) err.textContent = "保存失败：" + e.message; }
  };
}

function bindPerf() {
  stopPerfPoll();
  bindLimits();              // 「运行参数」那张卡的保存按钮（与图在同一页签）
  PERF.points = [];          // 进页签 = 重新按服务端的窗口对齐（服务端是权威）
  PERF.since = "";
  const start = $("#btnPerfStart"), stop = $("#btnPerfStop");
  if (start) {
    start.onclick = async () => {
      try { PERF.state = await wpost("/admin/api/perf/start"); }
      catch (e) { alert("开始记录失败：" + e.message); }
      PERF.points = []; PERF.since = "";
      await refreshPerf();
    };
  }
  if (stop) {
    stop.onclick = async () => {
      try { PERF.state = await wpost("/admin/api/perf/stop"); }
      catch (e) { alert("停止记录失败：" + e.message); }
      await refreshPerf();
    };
  }
  refreshPerf();
  PERF.timer = setInterval(refreshPerf, PERF_POLL_MS);
}

/* 增量合并：`since` = 上一批的 `nextSince`，所以每次只回新点（不是全量重拉）。
   服务端的环形窗口是权威 —— 已经滚出窗口的点，本地也丢掉。 */
function mergePoints(d) {
  const cap = Number(d.capacity || 900);
  const from = Number(d.firstSeq || 0);
  if (from > 0) PERF.points = PERF.points.filter((p) => Number(p.seq) >= from);
  let last = PERF.points.length ? Number(PERF.points[PERF.points.length - 1].seq) : 0;
  (d.series || []).forEach((p) => {
    if (Number(p.seq) > last) { PERF.points.push(p); last = Number(p.seq); }
  });
  if (PERF.points.length > cap) PERF.points = PERF.points.slice(-cap);
  if (d.nextSince != null) PERF.since = d.nextSince;
}

async function refreshPerf() {
  if (!$("#chart-gpu")) { stopPerfPoll(); return; }   // 已经切走了
  try {
    const q = PERF.since === "" ? "" : "?since=" + encodeURIComponent(PERF.since);
    const d = await api("/admin/api/perf/points" + q);
    PERF.state = d;
    mergePoints(d);
    drawAllCharts();
    const badge = $("#perfBadge");
    if (badge) {
      badge.className = "badge " + (d.recording ? "on" : "off");
      badge.textContent = d.recording ? "记录中" : "已停止";
    }
    const stat = $("#perfStat");
    if (stat) {
      const last = PERF.points.length ? PERF.points[PERF.points.length - 1] : {};
      const models = (last.modelsTotal == null ? "" :
        ` · 模型 ${Number(last.modelsReady || 0)}/${Number(last.modelsTotal)} 就绪`);
      stat.textContent = `已采 ${d.samples} 点 · 采样间隔 ${d.intervalSeconds}s`
        + ` · 窗口 ${Math.round(d.windowSeconds)}s（${d.capacity} 点）`
        + (d.dropped ? ` · 已滚出 ${d.dropped} 点` : "")
        + models
        + (d.sampling ? " · 正在采样" : " · 未采样（没人在看）");
    }
    const note = $("#perfNote");
    if (note) {
      note.textContent = "数据只在后端进程的内存里：不落盘，重启即清空。"
        + `关掉或切走这个页面后 ${Math.round(d.viewerTtlSeconds)} 秒内没人取点，采样自动停`
        + "（「记录中」这个状态留着，回来接着采）。"
        + (d.samplerError ? ` ⚠️ 采集报错：${d.samplerError}` : "");
    }
  } catch (e) {
    const stat = $("#perfStat");
    if (stat) stat.textContent = "取点失败：" + e.message;
  }
}

function table(head, rows) {
  if (!rows.length) return `<div class="muted">（没有数据）</div>`;
  return `<table><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((c) =>
      `<td>${(c && typeof c === "object" && c.__raw) ? c.__raw
             : (typeof c === "string" && c.startsWith("<span") ? c : esc(c))}</td>`).join("")}</tr>`).join("")}
    </tbody></table>`;
}

/* 页面被关掉 / 切走 / 进 bfcache：**立刻停掉轮询**。后端不需要收一个"关闭"请求 ——
   轮询一停，`viewerTtlSeconds` 一到采集线程自己就退了（而且那种关闭请求还得带
   `X-ECHO-Admin` + CSRF 头，`sendBeacon` 根本发不出来）。切回来时重画一次。 */
window.addEventListener("pagehide", stopPerfPoll);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopPerfPoll(); return; }
  const tab = (document.querySelector(".tabs button.active") || {}).dataset?.tab;
  if (tab === "perf" && !$("#app").classList.contains("hidden")) render();
});

boot();
</script>
</body>
</html>
