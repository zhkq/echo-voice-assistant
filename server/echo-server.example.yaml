# ECHO 能力后端 —— 参考配置。
#
# 不给 `--config` 就用内置默认值 + 环境变量；这份文件是把默认值摊开写一遍，
# 方便改。每一项的来历见 `docs/ECHO能力后端-服务端设计.md` §10。
server:
  id: gpu-01
  listen: "0.0.0.0:8900"
  # 管理面（设计 §8.4）的独立监听地址。**空 = 管理面关着**（出厂值）。
  # 独立端口的理由：防火墙规则一条就够（客户端网段 → 8900、运维网段 → 8901），
  # 比在同一端口上做路径级 ACL 可靠。
  # 2026-09-25 起管理面**可写**：发授权 / 禁用·启用 / 撤销 / 改 scopes / 改配额 /
  # 轮换 secret —— 全部要求管理员会话 + 同站 Origin + `X-ECHO-Admin` 头 + CSRF；
  # 危险动作还要 `confirm`。管理员账号本身仍只在这里建（管理面只读展示清单）：
  #     python -m server.main --new-admin ops
  admin_listen: "127.0.0.1:8901"
  # 容器里这行会被 `ECHO_ADMIN_LISTEN=0.0.0.0:8901` 覆盖（**必需**：绑回环只有容器自己
  # 进得去，宿主与 `ssh -L` 都连不上），而暴露范围由 `server/compose.yaml` 的
  # `127.0.0.1:8901:8901` 决定 —— 只看宿主回环。见 `docs/后端容器部署.md`。
  instance_id: gpu01-a          # 临时目录的命名空间（多实例互不清扫对方）
  # 显存预算：**按卡校准**，0 = 不限制。超预算**拒绝**而不是 OOM，也绝不回退 CPU。
  #   出厂样例这里给 20000 是**24 GB 卡的参考值**；本机 8 GB 卡的实测值是 **7000**。
  #   怎么按自己的卡算：把要**可能同时驻留**的模型估显存加起来，再留出桌面/显示占用
  #   （8 GB 卡上桌面吃掉约 1 GB+，所以预算不要顶到 8000）。
  #   ⚠️ 容器里**没有**对应的环境变量 —— 要改得挂一份配置 + `python -m server.main --config`。
  vram_budget_mb: 20000
  # **耐久**状态（鉴权库）放哪。空 = {ECHO}/data/server-state。
  # **故意与 `tmp.root` 分开**：tmp 是"随便删、可以挂 tmpfs"的，
  # 而鉴权库存着客户端凭据 —— 两者放一起意味着"照文档把 tmp 换成内存盘
  # 就会把配过的所有客户端清空"。容器里就是那两个保留策略相反的卷。
  state_root: /var/echo/state
  # TLS（设计 §7.5 ①）。**两个都填才启用 https**；只填一个是配置错误，直接起不来
  # （不静默降级成 http —— 那会让你以为连的是 https）。
  # 客户端靠"配对时固定服务端证书"来验，不需要给每台机器装自签根。
  # 容器里要把证书挂进来，例如 -v /etc/echo/tls:/etc/echo/tls:ro
  tls:
    certfile: ""          # 例如 /etc/echo/tls/server.crt
    keyfile: ""           # 例如 /etc/echo/tls/server.key

limits:
  # 2026-09-23 定：总通道 2、每客户端 1。
  # **不排队** —— 满了直接拒（503 server_busy），重试由客户端负责。
  max_concurrent: 2
  per_client_concurrent: 1
  queue_max: 0
  busy_retry_after_s: 5
  max_audio_seconds: 1800
  max_upload_bytes: 67108864
  load_timeout_s: 300
  inference_timeout_s: 900
  # 每客户端每日音频分钟数上限；0 = 不限（出厂值）。
  # 给某个客户端单独设上限走命令行：
  #   python -m server.main --set-quota <client_id> --daily-audio-minutes 120
  # 注意：用量计数在**进程内**，所以多实例部署时各算一份（设计 §7.2 写明的取舍）。
  daily_audio_minutes: 0

calls:
  # 调用元数据（设计 §7.3：只有 ts/client_id/endpoint/model_id/audio_seconds/
  # queue_wait_ms/duration_ms/status/error_code/request_id —— **没有内容**）。
  # 请求路径上只做一次 put_nowait，后台线程攒批写库（不把尾延迟绑在 fsync 上）。
  flush_interval_s: 1.0
  max_queue: 1000         # 满了丢并计数（/v1/health 的 metrics.calls.dropped 看得见）
  retention_days: 30      # 调用记录可以老死；0 = 不自动清

tmp:
  root: /var/echo/tmp           # 容器里挂的那一个可写卷；想更快就挂 tmpfs
  ttl_hours: 4                  # 定时清理：删超过这么久的（**请求结束本来就会删**）
  sweep_interval_s: 3600
  max_bytes: 4294967296         # 超了先删最老的，而不是拒绝新请求

models:
  root: /opt/echo/models
  # cuda | cpu。**要 cuda 而没有 CUDA 时直接失败**，不回退 CPU（设计 §3.4）——
  # 服务端一旦回退，会把所有客户端一起拖慢，而且从指标上看不出原因。
  device: cuda
  # 不写 specs 就用代码里的出厂清单（server/engines.py:default_specs）。
  # 写出来是为了能改；`est_vram_mb` 与 `max_concurrency` 都是**占位值**，上线前要压测校准。
  #
  # ## 这两个数是**按卡校准**的，别把小卡的实测值带到别的卡上、也别反过来
  #
  # `est_vram_mb` 是"这个模型常驻/加载时大约吃多少显存"，池子拿它跟 `vram_budget_mb`
  # 对账；`max_concurrency` 是"同一份权重能同时服务几路"（`diarize` 是 1，因为它不是
  # 线程安全的；`asr-long` 现在是 1）。
  #
  # 实测（2026-09-27，本机 8 GB 卡）：
  #   * **qwen3asr + 强制对齐器的峰值是 4.6 GB** —— 所以这里的 `est_vram_mb` 要给 **4700**，
  #     出厂样例的 3900 是**只算 ASR**的旧估值（对齐器是同一个进程里的第二份权重，
  #     它必须在**加载时**一起进来，见 `server/engines.py:_stt_loader`）。
  #     估小了不会报错，只会让池子以为"还有余量"而在第二次加载时溢出。
  #   * 对应的预算是 **7000**（不是 8000）：桌面 + 显示要留出 1 GB 左右。
  #
  # 怎么按自己的卡算：
  #   1. 列出**可能同时驻留**的模型（本清单里 `resident: false` 的按需加载，LRU 才会踢人，
  #      所以"两个模型别同时常驻"是最省事的一条）；
  #   2. 把它们的 `est_vram_mb` 加起来（对齐器算进 qwen3asr 那一项）；
  #   3. 再留出桌面/显示占用（8 GB 卡约 1 GB+，24 GB 卡也要留一点）；
  #   4. 剩下的写进 `vram_budget_mb`；`max_concurrent` 用真机并发压测校准。
  #   5. 校准完把实测数字写回注释 —— 下一个换卡的人才不会又从头猜一遍。
  specs:
    # 2026-09-24 定：**v1 不做独立的短档小模型**。
    # 理由：SenseVoice 常驻要一直占着显存，而 v1 里没有任何内部调用方用它
    # （长档走 qwen3asr），等于"又占显存、又和长档抢同一个槽"。
    # 短请求（几秒音频）交给 `asr-long` 的 `supports: [asr.text]` 兜住 ——
    # 慢一点但结果正确。等真要做指令增强时，把 asr-short 连同**配额机制**一起加回来。
    # 见 docs/ECHO能力后端-服务端设计.md §14-2。
    - id: asr-long              # 长音频（会议分段）：按需 + LRU；同时给文本与时间戳
      slot: asr.long
      impl: qwen3asr
      resident: false
      max_concurrency: 1
      # 8 GB 卡实测 4700（qwen3asr + 强制对齐器峰值 4.6 GB）；出厂样例原来是 3900 = 只算 ASR。
      # **必须**把对齐器算进来：`supports` 里的 `asr.timestamps` 就靠它。
      est_vram_mb: 4700
      modelVersion: qwen3-asr-0.6b
      supports: [asr.text, asr.timestamps]
    - id: diarize               # 说话人分离：**不是线程安全的**，并发只能 1
      slot: diarize.turns
      impl: pyannote
      resident: false
      max_concurrency: 1
      est_vram_mb: 2600
      modelVersion: pyannote-3.1-wespeaker-v1
      vectorSpaceId: ws-resnet34-v1
      dim: 256
      supports: [diarize.embeddings]
    - id: speaker-embed         # 说话人嵌入：与上面**同一个 vectorSpaceId**（要能互相比对）
      slot: speaker.embed
      impl: pyannote-embed
      resident: false
      max_concurrency: 1
      est_vram_mb: 0
      modelVersion: wespeaker-voxceleb-resnet34-LM-v1
      vectorSpaceId: ws-resnet34-v1
      dim: 256

auth:
  # **默认关**（本机起步）。监听地址不是回环时启动会大声告警 ——
  # 不配鉴权就等于"谁连上谁能用你的 GPU"。
  enabled: false
  # token = 静态令牌（v1 起步、单人）。jwt = 配对码 + secret + 短期 JWT（多人）。
  # 用 jwt 时**必须**配 jwt_secret，否则服务端起不来（刻意不随机生成：
  # 那会让进程一重启所有客户端全部 401，而现象很难联想到"密钥每次都是新的"）。
  #   openssl rand -hex 32
  mode: token
  tokens: []
  jwt_secret: ""
  token_ttl_s: 3600              # 短期令牌 1 小时（不做 refresh token）
  clock_skew_s: 60               # 内网机器时钟未必准，容忍 60 秒偏差
  pairing_enabled: true          # 关掉之后新机器进不来（老客户端照用）
  pairing_ttl_s: 900             # 配对码 15 分钟
  pair_window_s: 300             # 失败退避窗口
  pair_max_failures: 5           # 窗口内失败几次开始 429
  cache_ttl_s: 60                # client 行缓存多久（撤销走主动失效，不靠它）
  revoke_poll_s: 5               # 跨进程撤销的发现间隔（命令行 --revoke 靠它生效）
  default_scopes: ""             # 空 = 配对出来且码上没写 scope 的客户端没有额外限制
  # 空 = {server.state_root}/echo-server-auth.db。
  # **刻意不回退到 tmp.root**：那是"随便删、可以挂 tmpfs"的地方，
  # 而这里存的是客户端凭据 —— 放那儿就等于"照文档把 tmp 换成内存盘，所有客户端一起消失"。
  db: ""
  # 静态令牌模式大概长这样（每把令牌可以带自己的 scopes）：
  #   enabled: true
  #   tokens:
  #     - { client_id: cli-07a3f2, token: "<32 字节随机>", scopes: "asr diarize embed" }
  #     - { client_id: cli-11b9c4, token: "<...>", scopes: "asr" }
  #
  # jwt 模式：配好 jwt_secret 之后，用命令行管客户端（管理面网页还没做）。
  # **名字与 scope 跟着码走**，所以"给这台机器只开 asr"是能表达的：
  #   python -m server.main --new-client "张三的办公本" --scopes "asr diarize"
  #   python -m server.main --list-clients      # 看已配对的
  #   python -m server.main --list-codes        # 看待用的码与剩余时间（只有哈希）
  #   python -m server.main --show-client cli-07a3f2
  #   python -m server.main --revoke cli-07a3f2         # 撤销（版本号 +1，立即失效）
  #   python -m server.main --disable cli-07a3f2        # 禁用（回 403）/ --enable
  #   python -m server.main --set-scopes cli-07a3f2 --scopes "asr"
  #   python -m server.main --rotate-secret cli-07a3f2  # 换 secret，旧的立刻全失效
  # 把配对串给同事，他在客户端面板里粘一次即可。
  # 这些命令**直接开库、不打 HTTP** —— 安全边界就是"能读到这个库文件"。
