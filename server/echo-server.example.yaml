# ECHO 能力后端 —— 参考配置。
#
# 不给 `--config` 就用内置默认值 + 环境变量；这份文件是把默认值摊开写一遍，
# 方便改。每一项的来历见 `docs/ECHO能力后端-服务端设计.md` §10。
server:
  id: gpu-01
  listen: "0.0.0.0:8900"
  instance_id: gpu01-a          # 临时目录的命名空间（多实例互不清扫对方）
  vram_budget_mb: 20000         # 0 = 不限制；超预算**拒绝**而不是 OOM，也不回退 CPU

limits:
  # 2026-09-23 定：总通道 2、每客户端 1。
  # **不排队** —— 满了直接拒（503 server_busy），重试由客户端负责。
  max_concurrent: 2
  per_client_concurrent: 1
  queue_max: 0
  busy_retry_after_s: 5
  max_audio_seconds: 1800
  max_upload_bytes: 67108864
  load_timeout_s: 300
  inference_timeout_s: 900

tmp:
  root: /var/echo/tmp           # 容器里挂的那一个可写卷；想更快就挂 tmpfs
  ttl_hours: 4                  # 定时清理：删超过这么久的（**请求结束本来就会删**）
  sweep_interval_s: 3600
  max_bytes: 4294967296         # 超了先删最老的，而不是拒绝新请求

models:
  root: /opt/echo/models
  device: cuda                  # cuda | cpu。**要 cuda 而没有 CUDA 时直接失败**，不回退
  # 不写 specs 就用代码里的出厂清单（server/engines.py:default_specs）。
  # 写出来是为了能改；`est_vram_mb` 与 `max_concurrency` 都是**占位值**，上线前要压测校准。
  specs:
    # 2026-09-24 定：**v1 不做独立的短档小模型**。
    # 理由：SenseVoice 常驻要一直占着显存，而 v1 里没有任何内部调用方用它
    # （长档走 qwen3asr），等于"又占显存、又和长档抢同一个槽"。
    # 短请求（几秒音频）交给 `asr-long` 的 `supports: [asr.text]` 兜住 ——
    # 慢一点但结果正确。等真要做指令增强时，把 asr-short 连同**配额机制**一起加回来。
    # 见 docs/ECHO能力后端-服务端设计.md §14-2。
    - id: asr-long              # 长音频（会议分段）：按需 + LRU；同时给文本与时间戳
      slot: asr.long
      impl: qwen3asr
      resident: false
      max_concurrency: 1
      est_vram_mb: 3900
      modelVersion: qwen3-asr-0.6b
      supports: [asr.text, asr.timestamps]
    - id: diarize               # 说话人分离：**不是线程安全的**，并发只能 1
      slot: diarize.turns
      impl: pyannote
      resident: false
      max_concurrency: 1
      est_vram_mb: 2600
      modelVersion: pyannote-3.1-wespeaker-v1
      vectorSpaceId: ws-resnet34-v1
      dim: 256
      supports: [diarize.embeddings]
    - id: speaker-embed         # 说话人嵌入：与上面**同一个 vectorSpaceId**（要能互相比对）
      slot: speaker.embed
      impl: pyannote-embed
      resident: false
      max_concurrency: 1
      est_vram_mb: 0
      modelVersion: wespeaker-voxceleb-resnet34-LM-v1
      vectorSpaceId: ws-resnet34-v1
      dim: 256

auth:
  # **默认关**（本机起步）。监听地址不是回环时启动会大声告警 ——
  # 不配鉴权就等于"谁连上谁能用你的 GPU"。
  enabled: false
  # token = 静态令牌（v1 起步、单人）。jwt = 配对码 + secret + 短期 JWT（多人）。
  # 用 jwt 时**必须**配 jwt_secret，否则服务端起不来（刻意不随机生成：
  # 那会让进程一重启所有客户端全部 401，而现象很难联想到"密钥每次都是新的"）。
  #   openssl rand -hex 32
  mode: token
  tokens: []
  jwt_secret: ""
  token_ttl_s: 3600              # 短期令牌 1 小时（不做 refresh token）
  clock_skew_s: 60               # 内网机器时钟未必准，容忍 60 秒偏差
  pairing_enabled: true          # 关掉之后新机器进不来（老客户端照用）
  pairing_ttl_s: 900             # 配对码 15 分钟
  pair_window_s: 300             # 失败退避窗口
  pair_max_failures: 5           # 窗口内失败几次开始 429
  cache_ttl_s: 60                # client 行缓存多久（撤销走主动失效，不靠它）
  default_scopes: ""             # 空 = 配对出来的客户端没有额外限制
  db: ""                         # 空 = {tmp.root}/echo-server-auth.db
  # 静态令牌模式大概长这样（每把令牌可以带自己的 scopes）：
  #   enabled: true
  #   tokens:
  #     - { client_id: cli-07a3f2, token: "<32 字节随机>", scopes: "asr diarize embed" }
  #     - { client_id: cli-11b9c4, token: "<...>", scopes: "asr" }
  #
  # jwt 模式：配好 jwt_secret 之后，用命令行发配对码（管理面还没做）：
  #   python -m server.main --new-pairing-code --created-by 管理员
  # 把输出的配对串给同事，他在客户端面板里粘一次即可。
