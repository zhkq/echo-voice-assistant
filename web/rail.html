<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO 折叠条</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  /* 不要写死宽度：WebView2 的 CSS 像素 ≠ 宿主窗口的逻辑像素（150% 缩放时 100 逻辑 ≈ 67 CSS px），
     写死 width:100px 会让 body 比视口宽、内容向右溢出被裁掉（2026-09-12 实测用户截图即此现象）。
     这里改为自适应视口，尺寸用 min() 收缩，任何缩放/宽度下都居中且不被裁。 */
  body {
    width: 100%; max-width: 100%; overflow: hidden; user-select: none;
    background: #171a23; color: #e6e9f0;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 6px 10px; gap: 12px;
  }
  /* 标志：两行（EC / HO）+ 2×2 网格，蓝底圆角，像应用图标。
     尺寸按视口自适应（64 逻辑宽在 150% 缩放下 ≈ 43 CSS px），不写死以免被裁。 */
  .logo {
    width: min(38px, 88%); aspect-ratio: 1 / 1; border-radius: 10px;
    background: linear-gradient(160deg, #4f8cff 0%, #3a6fe0 100%);
    color: #fff; font-size: 13px; font-weight: 800; line-height: 1;
    letter-spacing: .5px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    place-items: center; padding: 4px 5px 3px;
    box-shadow: 0 2px 8px rgba(79,140,255,.35);
    user-select: none;
  }
  .logo span { display: block; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #e6b84c; border: 1px solid #2a2f3e; flex: 0 0 auto; }
  .dot.on { background: #3ecf8e; }
  .dot.off { background: #ef5b5b; }
  .sep { width: 30px; height: 1px; background: #2a2f3e; }

  /* 按钮：药丸形实心按钮（不是描边卡片）。宽度按视口自适应（64 逻辑宽 ≈ 43 CSS px），
     只用百分比以免在窄视口里被裁；竖排文字是小条里最省横向空间的排法。 */
  .btn {
    width: min(34px, 82%); border: none; border-radius: 20px;
    color: #fff; cursor: pointer;
    writing-mode: vertical-rl; text-orientation: upright;
    letter-spacing: 2px; font-size: 12px; font-weight: 700;
    display: grid; place-items: center;
    padding: 8px 0;
    box-shadow: 0 3px 10px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.14);
    transition: filter .15s, transform .06s, box-shadow .15s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(1px) scale(.985); box-shadow: 0 1px 4px rgba(0,0,0,.4); }

  /* 录音：实心红；录音中更亮并呼吸 */
  #btnRec { height: 92px; background: linear-gradient(180deg, #ef5b5b, #d64545); }
  #btnRec.rec { background: linear-gradient(180deg, #ff6b6b, #ef5b5b); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .78 } }

  /* 说话：实心蓝 */
  #btnSay { height: 78px; background: linear-gradient(180deg, #4f8cff, #3a6fe0); }
  #btnSay.hot { animation: pulse 1.6s ease-in-out infinite; }
  #btnSay:disabled { filter: grayscale(.35) brightness(.85); cursor: not-allowed; }

  /* 电平：竖排 6 格，自下而上增长。
     窄视口（64 逻辑宽 ≈ 43 CSS px）下 1px 边框 + 2px 间隙会把格子吃掉、糊成一条线，
     因此改用"无边框 + 内阴影"表现未点亮态，点亮时纯色 + 外发光（2026-09-12 实测调整）。 */
  .level { display: flex; flex-direction: column-reverse; gap: 3px; margin-top: 2px; width: 100%; align-items: center; }
  .level i {
    width: min(30px, 68%); height: 8px; border-radius: 3px;
    background: #2b3145; box-shadow: inset 0 0 0 1px #343b52;
    transition: background .08s, box-shadow .08s;
  }
  .level i.hot { background: #3ecf8e; box-shadow: 0 0 7px rgba(62,207,142,.6); }
  .level i.warn { background: #e6b84c; box-shadow: 0 0 7px rgba(230,184,76,.6); }
  .level i.clip { background: #ef5b5b; box-shadow: 0 0 7px rgba(239,91,91,.65); }

  /* 状态区：快捷键提示上方，四行（DSH / 模型路由 / ECHO 状态 / 在线时长）。
     折叠条只有 64 逻辑宽（内容区约 52px），所以是"小圆点 + 极短文字"。
     2026-09-12 修版式：原来新加的时长/状态是一套"居中纯文字"+ 一颗自适应宽度的灯，
     与下面三颗固定宽度左对齐的灯不成一条竖线（圆点差 9.5px）。现在统一成同一套行：
     同一字号、同一行距、圆点左对齐成一列；顺序由用户指定为 DSH → 路由 → 状态 → 时间。 */
  .status { width: 100%; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .s-row { display: flex; align-items: center; gap: 4px; width: min(46px, 92%); }
  .s-dot {
    width: 7px; height: 7px; border-radius: 50%; background: #4a5163; flex: 0 0 auto;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07);
  }
  .s-dot.on { background: #3ecf8e; box-shadow: 0 0 6px rgba(62,207,142,.55); }
  .s-dot.warn { background: #e6b84c; box-shadow: 0 0 6px rgba(230,184,76,.5); }
  .s-dot.off { background: #ef5b5b; box-shadow: 0 0 6px rgba(239,91,91,.5); }
  .s-dot.busy { background: #4f8cff; box-shadow: 0 0 6px rgba(79,140,255,.55); }   /* 命令处理中 */
  .s-dot.rec { background: #c07bff; box-shadow: 0 0 7px rgba(192,123,255,.6); }    /* 会议录音中（紫，红只留给故障） */
  /* 文字位只有 35px（行宽 46 − 圆点 7 − 间距 4）。通道昵称可能偏长，超长以省略号收尾 ——
     完整昵称 + 通道号仍在悬停说明（title）里，灯上不放"通道N"（用户 2026-09-13 要求）。 */
  .s-txt {
    font-size: 9.5px; color: #98a0b5; line-height: 1; white-space: nowrap;
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  }

  /* 在线时长：灯组最后一行，与灯行同轴（左缘对齐），"在线"小一号灰字 + 时长稍亮 */
  .live { width: 100%; display: flex; align-items: center; justify-content: center; }
  .live-t {
    width: min(46px, 92%); font-size: 9.5px; line-height: 1; white-space: nowrap;
    color: #cfd6e6; font-weight: 600; font-variant-numeric: tabular-nums;
    overflow: visible;
  }
  .live-t .k { font-size: 7.5px; font-weight: 400; color: #5a6170; margin-right: 2px; }
  /* 极端窄（真实折叠条固定 64 CSS px，理论到不了这）：先让出"在线"二字，只留时长数字 */
  @media (max-width: 56px) { .live-t .k { display: none; } }

  /* 底端：快捷键提示 + 两个方向箭头（用户 2026-09-12 要求：取消自动隐藏，改为点箭头手动隐藏；
     2026-09-13 要求：在隐藏箭头左边加一个向左箭头，用于展开成仪表盘边条）。
     折叠条内容区只有 52px，两个按钮各 min(23px,44%) + 5px 间距 = 51px 才放得下。 */
  .bottom { margin-top: auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .actions { width: 100%; display: flex; justify-content: center; gap: 5px; }
  .hide {
    width: min(23px, 44%); height: 26px; padding: 0;
    display: grid; place-items: center;
    background: #232838; color: #98a0b5;
    border: 1px solid #303748; border-radius: 9px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
    transition: background .15s, color .15s, transform .06s;
  }
  .hide:hover { background: #2c3348; color: #cfd6e6; }
  .hide:active { transform: translateY(1px) scale(.96); }
  .hide svg { display: block; }

  .hint { font-size: 9.5px; color: #5a6170; line-height: 1.55; text-align: center; }
  .hint b { color: #8b93a7; font-weight: 600; }
  .toast { position: fixed; left: 4px; right: 4px; bottom: 64px; background: #262c3d;
           color: #e6e9f0; font-size: 10px; line-height: 1.4; padding: 5px; border-radius: 7px;
           text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="logo" title="ECHO"><span>E</span><span>C</span><span>H</span><span>O</span></div>
  <div class="dot" id="dot" title="服务状态"></div>

  <button class="btn" id="btnRec" title="开始/停止会议录音">录音</button>

  <div class="level" id="level" title="麦克风电平（仅会议录音中有效）">
    <i></i><i></i><i></i><i></i><i></i><i></i>
  </div>

  <button class="btn" id="btnSay" title="按压说话（快捷键同 Ctrl+Alt+C）">说话</button>

  <button class="btn" id="btnModels" title="展开面板并打开「能力」页签（用哪个实现 + 装没装）">能力</button>

  <div class="bottom">
    <div class="sep"></div>
    <!-- 状态区（用户 2026-09-12 指定顺序，从上到下）：DSH → 模型路由 → ECHO 状态 → 在线时长。
         四行同一套「圆点 + 短文字」，圆点对齐成一列；时长行左缘与圆点同列。
         第一颗灯以外的三行都不是"服务名"，所以灯文字直接用状态词（空闲/处理中/录音中/离线）。 -->
    <div class="status" id="svcStatus">
      <div class="s-row" id="rowDsh" title="当前智能体的状态（DSH Desktop / 标准版 harness / CodeBuddy 三选一）">
        <i class="s-dot"></i><span class="s-txt">智能体</span>
      </div>
      <div class="s-row" id="rowNet" title="模型路由（ECHO AUTO）：按通道号顺序派发，通道不通自动换下一个">
        <i class="s-dot"></i><span class="s-txt">路由</span>
      </div>
      <div class="s-row" id="rowEcho" title="ECHO 服务状态">
        <i class="s-dot"></i><span class="s-txt">未知</span>
      </div>
      <div class="live" id="live" title="ECHO 服务在线时长">
        <div class="live-t"><span class="k">在线</span><span id="liveUp">—</span></div>
      </div>
    </div>
    <div class="hint"><b>Ctrl+Shift+E</b><br>展开</div>
    <div class="actions">
      <!-- 向左箭头（左边，用户 2026-09-13 要求）：把折叠条展开成仪表盘边条（面板页启动即停在仪表盘页签） -->
      <button class="hide" id="btnExpand" title="展开成仪表盘边条（快捷键 Ctrl+Shift+E）" aria-label="展开成仪表盘边条">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <!-- 向右箭头（右边）：隐藏折叠条，只留屏右缘一条，鼠标贴边唤回 -->
      <button class="hide" id="btnHide" title="隐藏折叠条（鼠标贴屏幕右缘可唤回）" aria-label="隐藏折叠条">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
  // 本页由 echo-sidebar.exe 承载，但经 http://127.0.0.1:<ECHO端口>/web/rail.html
  // 同源加载（不再是 file://），所以 API 用相对路径即可——端口由 ECHO 决定，
  // 页面无需知道端口号，换端口也不必改这里。
  const API = "";
  const dot = document.getElementById("dot");
  const btnRec = document.getElementById("btnRec");
  const btnSay = document.getElementById("btnSay");
  const btnHide = document.getElementById("btnHide");
  const btnExpand = document.getElementById("btnExpand");
  const bars = [...document.querySelectorAll("#level i")];
  const toastEl = document.getElementById("toast");
  const rowDsh = document.getElementById("rowDsh");
  const rowEcho = document.getElementById("rowEcho");
  const rowNet = document.getElementById("rowNet");
  const liveUp = document.getElementById("liveUp");
  const liveBox = document.getElementById("live");

  /* 在线时长：折叠条只有几个字符的宽度，用 1h20m / 20m / 35s 这种最短写法 */
  function fmtUptime(s) {
    const t = Math.max(0, Math.round(s || 0));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), ss = t % 60;
    if (h >= 100) return "99h+";
    return h > 0 ? `${h}h${m}m` : (m > 0 ? `${m}m` : `${ss}s`);
  }
  /* 中文全称（给 title 用，鼠标悬停看完整口径） */
  function fmtUptimeLong(s) {
    const t = Math.max(0, Math.round(s || 0));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), ss = t % 60;
    return h > 0 ? `${h}时${m}分` : (m > 0 ? `${m}分${ss}秒` : `${ss}秒`);
  }

  /* 状态区：一个小圆点 + 极短文字。cls: "" 灰 | on 绿 | warn 黄 | off 红 */
  function setSvc(row, cls, text, tip) {
    if (!row) return;
    const dot = row.querySelector(".s-dot");
    if (dot) dot.className = "s-dot" + (cls ? " " + cls : "");
    const txt = row.querySelector(".s-txt");
    if (txt) txt.textContent = text;
    row.title = tip;
  }

  let recording = false;
  let busy = false;
  let toastTimer = null;
  let levelTimer = null;

  function toast(msg, ms = 2200) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms);
  }

  async function post(path, body) {
    const r = await fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
      signal: AbortSignal.timeout(8000),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  function renderButtons() {
    btnRec.textContent = recording ? "停止" : "录音";
    btnRec.classList.toggle("rec", recording);
    btnSay.disabled = busy;
    btnSay.classList.toggle("hot", busy);
    btnSay.textContent = busy ? "处理中" : "说话";
  }

  function setLevel(v) {
    v = Math.max(0, Math.min(1, v || 0));
    const lit = Math.round(v * bars.length);
    bars.forEach((b, i) => {
      b.className = "";
      if (i < lit) b.className = i >= bars.length - 1 ? "clip" : (i >= bars.length - 2 ? "warn" : "hot");
    });
  }

  async function pollStatus() {
    try {
      const r = await fetch(API + "/api/status", { signal: AbortSignal.timeout(2500) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const st = await r.json();
      dot.className = "dot on";
      recording = !!(st.meeting && st.meeting.active);
      busy = !!st.busy;
      if (!recording) setLevel(0);
      // ECHO 状态（灯组第三行）：绿=空闲 / 蓝=命令处理中 / 紫=录音中 / 红=离线，
      // 在线时长紧接在灯组最后一行（"在线 1h20m"），口径与面板启动页一致
      const up = fmtUptime(st.uptime);
      liveUp.textContent = up;
      liveBox.title = `ECHO 服务已连续在线 ${fmtUptimeLong(st.uptime)}`;
      const lv = (st.meeting && st.meeting.active)
        ? ["rec", "录音中", `会议录音中${st.meeting.folder ? "：" + st.meeting.folder : ""}`]
        : (st.busy ? ["busy", "处理中", `正在处理一条指令${st.busyPhase ? "（" + st.busyPhase + "）" : ""}`]
                   : ["on", "空闲", "没有正在执行的任务"]);
      setSvc(rowEcho, lv[0], lv[1],
        `ECHO 服务在线 · 已连续在线 ${fmtUptimeLong(st.uptime)} · 当前${lv[1]} · ${lv[2]}`);
      // 当前智能体（DSH Desktop / 标准版 harness / CodeBuddy 是**单选**）。
      // 从前这里读顶层 `st.dsh` —— 那是**桌面版**适配器，选了标准版 harness 时它恒为 false，
      // 于是折叠条常年红灯「DSH×」（2026-09-22 同事实测：同事选了标准版，条上却红着 dsh）。
      // 与"安装脚本拿顶层 dsh 判 harness，把成功安装报成失败"是同一个病。
      const ag = st.agent || {};
      const agName = ag.shortName || ag.displayName || "智能体";
      const agFull = ag.displayName || agName;
      if (ag.online) {
        setSvc(rowDsh, "on", agName, `${agFull} 在线${ag.detail ? "：" + ag.detail : ""}`);
      } else if (ag.status && ag.status !== "unknown" && ag.status !== "skipped") {
        setSvc(rowDsh, "off", agName + "×",
               `${agFull} 未就绪${ag.detail ? "：" + ag.detail : ""}（命令/会议纪要靠它）`);
      } else {
        setSvc(rowDsh, "", agName, `读不到 ${agFull} 的状态`);
      }
      if (!levelTimer) {
        // 只有录音/采集期间才有电平，平时不轮询，省开销
        levelTimer = setInterval(async () => {
          if (!recording) return;
          try {
            const lv = await fetch(API + "/api/audio/level", { signal: AbortSignal.timeout(1500) }).then((x) => x.json());
            setLevel(lv.level || 0);
          } catch { setLevel(0); }
        }, 150);
      }
    } catch {
      dot.className = "dot off";
      liveUp.textContent = "—";
      liveBox.title = "ECHO 服务不可达，读不到在线时长";
      setSvc(rowEcho, "off", "离线", "ECHO 服务不可达（时长与状态都读不到）");
      setSvc(rowDsh, "", "智能体", "未知（需 ECHO 服务才能读取智能体状态）");
      setSvc(rowNet, "", "路由", "未知（需 ECHO 服务才能读取路由状态）");
    }
    renderButtons();
  }

  /* 模型路由状态：走排在第一位、且在服的通道=绿 / 改走后面通道=黄 / 全挂=红。
     折叠条太窄：灯上只放**当前在服通道的昵称**（用户 2026-09-13 要求：不再显示"通道N"），
     通道号、不可用原因等完整口径放进悬停说明；昵称过长由 .s-txt 的省略号收尾。 */
  async function pollNet() {
    try {
      const d = await fetch(API + "/api/failover/health", { signal: AbortSignal.timeout(2500) }).then((r) => r.json());
      if (d.proxy_online === false) {
        setSvc(rowNet, "warn", "路由", "模型路由进程未运行：ECHO AUTO 暂时不可用（重启 ECHO 可自动拉起）");
        return;
      }
      const g = (d.groups || []).find((x) => x.id === "echo-auto") || (d.groups || [])[0];
      const act = (g && g.members || []).filter((m) => m.enabled !== false);
      if (!act.length) { setSvc(rowNet, "", "路由", "模型组里没有启用的通道"); return; }
      const nm = (m) => `通道${m.priority} ${m.name}`;               // 完整口径，只进 title
      const short = (m) => String(m.name || "").trim() || "未命名";  // 灯上只放昵称
      const up = (m) => m.reachable !== false && m.state !== "open";
      const first = act[0];
      const alive = act.filter(up);
      const rt = d.routes || {};
      const at = rt.last_route_at ? "（最近派发 " + rt.last_route_at + "）" : "";
      if (up(first)) {
        setSvc(rowNet, "on", short(first), `请求走 ${nm(first)}` + at);
      } else if (alive.length) {
        setSvc(rowNet, "warn", short(alive[0]),
          `${nm(first)} 当前不可用（${first.last_error || first.detail}），请求改走 ${nm(alive[0])}` + at);
      } else {
        setSvc(rowNet, "off", "无可用", "模型组所有通道都不可用：" +
          act.map((m) => `${nm(m)}（${m.last_error || m.detail}）`).join("；"));
      }
    } catch {
      setSvc(rowNet, "", "路由", "路由状态不可达（ECHO 服务侧读取失败）");
    }
  }

  btnRec.addEventListener("click", async () => {
    btnRec.disabled = true;
    try {
      const r = await post(recording ? "/api/meeting/stop" : "/api/meeting/start");
      toast(r.message || (recording ? "已停止录音" : "已开始录音"));
    } catch (e) {
      toast("操作失败：" + e.message);
    } finally {
      btnRec.disabled = false;
      setTimeout(pollStatus, 400);
    }
  });

  btnSay.addEventListener("click", async () => {
    btnSay.disabled = true;
    try {
      const r = await post("/api/assistant/capture", { source: "rail" });
      toast(r.message || "已开始录音命令");
    } catch (e) {
      toast("操作失败：" + e.message);
    } finally {
      setTimeout(pollStatus, 600);
    }
  });

  // 展开箭头（左）：通知宿主把折叠条展开成仪表盘边条。宿主 Expand() 会重新加载主面板，
  // 而主面板启动即 switchView("dashboard")，所以展开后落在仪表盘页签。
  // 走同一条 WebView2 桥，不依赖 ECHO 服务（服务没起也能展开，面板自己显示"不可达"）。
  btnExpand.addEventListener("click", () => {
    const wv = window.chrome && window.chrome.webview;
    if (wv && typeof wv.postMessage === "function") {
      wv.postMessage("rail-expand");
      return;
    }
    toast("仅在折叠条中可展开");
  });

  // 「能力」按钮：先让主面板展开后落在「能力」页签（同源 localStorage 传意图），再通知宿主展开。
  const btnModels = document.getElementById("btnModels");
  btnModels.addEventListener("click", () => {
    try { localStorage.setItem("echo.gotoView", "capabilities"); } catch (e) { /* 忽略 */ }
    const wv = window.chrome && window.chrome.webview;
    if (wv && typeof wv.postMessage === "function") {
      wv.postMessage("rail-expand");
      return;
    }
    toast("仅在折叠条中可展开");
  });

  // 隐藏箭头：通知宿主把折叠条收到屏右缘（只留 3 逻辑像素），之后鼠标贴右缘即可唤回。
  // 走 WebView2 内置桥（宿主 Program.cs 的 WebMessageReceived），不依赖 ECHO 服务。
  btnHide.addEventListener("click", () => {
    const wv = window.chrome && window.chrome.webview;
    if (wv && typeof wv.postMessage === "function") {
      wv.postMessage("rail-hide");
      return;
    }
    toast("仅在折叠条中可隐藏");
  });

  // 父窗口（echo-sidebar.exe）用 --collapsed 启动本页；它通过 postMessage 通知当前是否收起，
  // 收起态才值得轮询状态（展开态由主面板负责显示）。
  window.addEventListener("message", (e) => {
    if (e.data === "rail-shown") pollStatus();
  });

  pollStatus();
  pollNet();
  setInterval(pollStatus, 3000);
  setInterval(pollNet, 3000);
</script>
</body>
</html>
