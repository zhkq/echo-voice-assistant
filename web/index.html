<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO · 个人助理控制台</title>
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/web/icon-192.png">
<link rel="apple-touch-icon" href="/web/icon-192.png">
<link rel="stylesheet" href="/web/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">ECHO<span class="sub">个人助理</span></div>
  <nav class="tabs">
    <button class="tab active" data-view="dashboard">仪表盘</button>
    <button class="tab" data-view="settings">设置</button>
    <button class="tab" data-view="history">历史</button>
    <button class="tab" data-view="meetings">会议</button>
    <button class="tab" data-view="boot">启动</button>
    <button class="tab" data-view="failover">模型路由</button>
    <button class="tab" data-view="models">模型</button>
  </nav>
</header>

<main>
  <!-- ============ 仪表盘 ============ -->
  <section id="view-dashboard" class="view">
    <div class="grid dashboard-grid">
      <!-- 命令模块：控制 + 目标选择 + 近期历史 -->
      <div class="card span-2" id="cmdCard">
        <div class="card-title"><span class="ic sbadge" title="超级助理"><b>S</b></span>超级助理
          <div class="mic-level hidden" id="cmdLevel" title="语音命令收音电平"><i></i><i></i><i></i><i></i><i></i></div>
          <a class="more" id="gotoHistory" href="#">全部 ›</a>
        </div>
        <div class="card-body row">
          <input id="cmdInput" placeholder="例如：帮我把今天的待办整理成列表" class="input grow">
          <button class="btn" id="btnCmdSend">发送</button>
          <button class="btn" id="btnCapture">🎤 说话</button>
        </div>
        <div class="target-row">
          <select id="wsSelect" class="ctl" title="命令发送到哪个工作区（选中即保存；语音命令也用这个目标）"></select>
          <select id="sessSelect" class="ctl" title="命令发送到哪个对话（选中即保存；留空=该工作区最近对话/新建）"></select>
        </div>
        <div class="cmd-list" id="recentCmds"></div>
      </div>

      <!-- 会议模块：控制 + 近期历史 -->
      <div class="card span-2" id="meetingCard">
        <div class="card-title"><span class="ic">🎙️</span>会议录音
          <span class="badge" id="meetingBadge">空闲</span>
          <div class="mic-level hidden" id="micLevel" title="麦克风电平">
            <i></i><i></i><i></i><i></i><i></i>
          </div>
          <a class="more" id="gotoMeetings" href="#">全部 ›</a>
        </div>
        <div class="card-body row">
          <button class="btn big" id="btnMeeting">开始录音</button>
          <div class="muted" id="meetingInfo">未在录音</div>
        </div>
        <div class="meeting-list" id="recentMeetings"></div>
      </div>

      <!-- 模型路由：仪表盘小卡片（点击进详情页签）+ 右下角"收起为折叠条"箭头 -->
      <div class="fo-wrap span-2" id="foWrap">
        <div class="card failover-card" id="failoverCard" title="点击查看完整路由历史与状态">
          <div class="card-title"><span class="ic">🛰️</span>模型路由
            <span class="badge idle" id="foStateText">检查中…</span>
            <a class="more" data-goto-link="failover" href="#">详情 ›</a>
          </div>
          <div class="card-body failover-row">
            <div class="fo-right" id="foCounts"></div>
          </div>
        </div>
        <button class="rail-btn" id="btnRailCollapse" aria-label="收起为折叠条"
                title="收起为折叠条（Ctrl+Shift+E 展开；鼠标贴屏幕右缘可唤回）">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ============ 设置 ============ -->
  <section id="view-settings" class="view hidden">
    <div class="card">
      <div class="card-title">设置 <span class="muted">(保存到本地数据库)</span>
        <span class="spacer"></span>
        <button class="btn" id="btnSettingsSave">保存</button>
        <!-- 双箭头（2026-09-13 用户要求把文字按钮换成双箭头交互，并放到最右侧）：
             朝上=点了折叠全部，全折叠后翻 180° 朝下 -->
        <button class="btn icon" id="btnSettingsCollapseAll" title="折叠全部分组" aria-label="折叠全部分组">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 11.5 12 7l6 4.5" />
            <path d="M6 18.5 12 14l6 4.5" />
          </svg>
        </button>
      </div>
      <div id="settingsForm" class="settings-form"></div>
    </div>
    <!-- 服务运维：重启 ECHO 本身（独立进程执行，面板自动重连） -->
    <div class="card">
      <div class="card-title">🔧 服务
        <span class="muted" id="svcHint">重启会中断正在进行的录音/命令</span>
      </div>
      <div class="card-body row">
        <button class="btn danger" id="btnRestartEcho" title="停止并重新启动 ECHO 服务进程">重启 ECHO 服务</button>
        <span class="muted" id="restartState"></span>
      </div>
    </div>
  </section>

  <!-- ============ 历史 ============ -->
  <section id="view-history" class="view hidden">
    <div class="card">
      <div class="card-title">命令历史
        <span class="spacer"></span>
        <button class="btn danger" id="btnClearCmds">清空</button>
      </div>
      <div id="historyList" class="cmd-list"></div>
    </div>
  </section>

  <!-- ============ 会议 ============ -->
  <section id="view-meetings" class="view hidden">
    <div class="card">
      <div class="card-title">会议列表
        <span class="spacer"></span>
        <button class="btn" id="btnMeetingFromList">开始录音</button>
        <button class="btn danger" id="btnCleanShort" title="删除 2 分钟以内的会议录音（含音频）">清理短录音</button>
      </div>
      <div id="meetingList" class="meeting-list"></div>
    </div>
  </section>

  <!-- ============ 启动 ============ -->
  <section id="view-boot" class="view hidden">
    <div class="card">
      <div class="card-title">启动状态
        <span class="spacer"></span>
        <span class="muted" id="bootSummary">—</span>
      </div>
      <div id="bootComponents" class="boot-list"></div>
    </div>
    <div class="card">
      <div class="card-title">启动日志 <span class="muted" style="font-size:12px">(自动刷新)</span>
        <span class="spacer"></span>
        <!-- 在线时长 + 当前状态（用户 2026-09-12：原顶栏右上角那组信息挪到这里） -->
        <span class="boot-live" id="bootLive">—</span>
      </div>
      <div id="bootLogs" class="boot-log"></div>
    </div>
  </section>

  <!-- ============ 模型路由：通道设置 + 派发情况（两张独立卡片，2026-09-13 拆分） ============ -->
  <section id="view-failover" class="view hidden">
    <div class="card">
      <div class="card-title"><span class="ic">🛰️</span>通道设置
        <span class="badge idle" id="rtBadge">检查中…</span>
        <span class="spacer"></span>
        <a class="rt-link" id="rtDashLink" href="#" target="_blank" rel="noopener"
           title="打开路由自带页面：命中统计与切换历史">仪表盘 ↗</a>
      </div>
      <div class="card-body">
        <div class="rt-reg muted" id="rtReg">加载中…</div>
        <div class="rt-list" id="rtMembers"></div>
        <div class="rt-add">
          <select id="rtCandSelect" class="ctl grow" title="候选来自 DSH 里已配置的模型供应商"></select>
          <button class="btn" id="rtAdd" title="加入模型组">＋ 加入</button>
          <button class="btn" id="rtSave" title="保存并让路由热重载 + 同步注册到 DSH">保存</button>
        </div>
        <div class="rt-foot">
          <button class="link" id="rtProbe" title="不等后台周期，马上把所有成员探一遍">立即探测</button>
          <span class="rt-sep">·</span>
          <button class="link" id="rtReload" title="让路由进程重读 config.json">重载配置</button>
          <span class="rt-sep">·</span>
          <button class="link" id="rtRegister" title="把当前模型组写成 DSH 的本地模型">注册到 DSH</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span class="ic">📊</span>派发情况</div>
      <div class="card-body">
        <div class="rt-stats" id="rtStats"></div>
      </div>
    </div>
  </section>

  <!-- ============ 模型：按「功能」组织（选择 + 就绪 + 获取），与设置页解耦 ============ -->
  <section id="view-models" class="view hidden">
    <div class="card">
      <div class="card-title"><span class="ic">🧠</span>模型
        <span class="muted" id="modelOvSummary">—</span>
        <span class="spacer"></span>
        <button class="btn" id="btnModelDownloadMissing" title="下载所有缺失且可从上游获取的模型">一键下载缺失</button>
      </div>
      <div class="model-ov" id="modelOverview"></div>
    </div>
    <div class="model-cards" id="modelCards"></div>
    <div class="muted model-foot">
      路径是代码约定，改了加载器就找不到模型，所以原样展示。「已选但未就绪」会标红并给「去安装/去下载」。
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="/web/app.js"></script>
</body>
</html>
